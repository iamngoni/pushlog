[package]
name = "pushlog-worker"
version = "0.1.0"
edition = "2021"
authors = ["Ngonidzashe Mangudya"]
description = "Cloudflare Worker serving the Pushlog API over D1: profiles, friends, workout sync, and lead-change push delivery."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.8.5", features = ["d1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"
console_log = "1.0"
console_error_panic_hook = { version = "0.1", optional = true }
uuid = { version = "1.10", features = ["v4", "js"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
getrandom = { version = "0.2", features = ["js"] }
base64 = "0.22"
sha2 = "0.11.0"
rsa = { version = "=0.10.0-rc.18" }
crypto-bigint = "=0.7.5"
url = "2"

[features]
default = ["console_error_panic_hook"]
integration-test-auth = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
