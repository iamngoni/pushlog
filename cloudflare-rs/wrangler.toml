name = "pushlog-api-staging"
main = "src/entry.mjs"
compatibility_date = "2026-08-06"
compatibility_flags = ["nodejs_compat"]

[vars]
FIREBASE_PROJECT_ID = "pushlog-app"
ENVIRONMENT = "staging"

[version_metadata]
binding = "CF_VERSION_METADATA"

[[d1_databases]]
binding = "DB"
database_name = "pushlog-staging"
database_id = "150fa67b-ecf6-4833-a10a-2be0816e7678"
migrations_dir = "migrations"

[ai]
binding = "AI"

[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[build]
command = "cargo install -q worker-build --version 0.8.5 && worker-build --release"
