name: pushlog
description: A Very Good Project created by Very Good CLI.
version: 1.1.0+21
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ^3.41.0

dependencies:
  bloc: ^9.2.0
  camera: ^0.12.0+2
  dartz: ^0.10.1
  equatable: ^2.0.7
  firebase_app_check: ^0.4.6
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^19.4.2
  flutter_localizations:
    sdk: flutter
  flutter_timezone: ^4.1.1
  get_it: ^8.0.3
  google_mlkit_face_detection: ^0.15.1
  google_sign_in: ^7.1.1
  google_sign_in_ios: ^6.2.2
  injectable: ^2.5.0
  intl: ^0.20.2
  share_plus: ^11.1.0
  shared_preferences: ^2.3.4
  timezone: ^0.10.1

dev_dependencies:
  bloc_lint: ^0.4.1
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.23
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.2.0

flutter:
  config:
    enable-swift-package-manager: false
  generate: true
  uses-material-design: true
  assets:
    # The brand mark only. pushlog_icon_master.png is an 813KB source file
    # for generating launcher icons, so it is deliberately not bundled.
    - assets/brand/Pushlog-logo.png
