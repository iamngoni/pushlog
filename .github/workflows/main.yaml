name: pushlog

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        run: .github/scripts/setup_flutter.sh
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --concurrency=1

  worker:
    runs-on: self-hosted
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cloudflare-rs
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: rustup target add wasm32-unknown-unknown
      - name: Install worker-build native dependencies
        shell: bash
        run: |
          if ! command -v apt-get >/dev/null; then
            echo "This self-hosted runner must provide pkg-config and OpenSSL development headers."
            exit 1
          fi

          if [ "$(id -u)" -eq 0 ]; then
            apt-get update
            apt-get install --yes --no-install-recommends pkg-config libssl-dev
          elif command -v sudo >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends pkg-config libssl-dev
          else
            echo "Installing pkg-config and libssl-dev requires root or sudo on this runner."
            exit 1
          fi
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets
      - name: Install cargo-llvm-cov when absent
        run: command -v cargo-llvm-cov >/dev/null || cargo install cargo-llvm-cov --version 0.8.7 --locked
      - run: npm run test:coverage
      - run: npm run test:integration
      - run: cargo build --target wasm32-unknown-unknown --release
      - run: npm audit
